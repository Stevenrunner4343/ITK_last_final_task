<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Wallet</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="container">
        <h1>🔐 JWT Тест</h1>
        
        <div class="tab">
            <button id="tabSignIn" class="active" onclick="switchTab('signIn')">Вход</button>
            <button id="tabSignUp" onclick="switchTab('signUp')">Регистрация</button>
        </div>

        <!-- Sign In -->
        <form id="signInForm" class="form" onsubmit="signIn(event)">
            <input type="text" id="loginUsername" placeholder="Имя пользователя" required>
            <input type="password" id="loginPassword" placeholder="Пароль" required>
            <button type="submit">Войти</button>
        </form>

        <!-- Sign Up -->
        <form id="signUpForm" class="form hidden" onsubmit="signUp(event)">
            <input type="text" id="regUsername" placeholder="Имя пользователя" required>
            <input type="email" id="regEmail" placeholder="Email" required>
            <input type="password" id="regPassword" placeholder="Пароль" required>
            <button type="submit">Зарегистрироваться</button>
        </form>

        <div id="message" class="message"></div>
        <div class="token-label">📋 Ваш токен:</div>
        <div id="tokenDisplay" class="token-box"></div>
    </div>

    <script src="Registrationscript.js"></script>
</body>
</html>
