<!DOCTYPE html>
<html>
<head>
    <title>Registration</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: #f4f4f4; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; padding: 30px; border-radius: 10px; width: 400px; }
        h1 { text-align: center; margin-bottom: 20px; }
        input, button { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ddd; border-radius: 5px; }
        button { background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        #message { margin-top: 10px; text-align: center; }
        .green { color: green; }
        .red { color: red; }
    </style>
</head>
<body>

<div class="container">
    <h1>Registration</h1>
    
    <input type="text" id="username" placeholder="Username">
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button id="registerBtn">Register</button>
    <p id="message"></p>
</div>
    
    <script src="./Registrationscript.js"></script>
</body>
</html>
